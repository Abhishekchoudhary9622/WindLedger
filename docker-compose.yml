services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windledger-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windledger-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
